services:
  phpfpm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk_phpfpm
    environment:
      - DB_HOST=db
      - DB_NAME=hesk_db
      - DB_USER=root
      - DB_PASS=rootpassword
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    restart: always
    networks:
      - helpdesk_net

  nginx:
    image: nginx:alpine
    container_name: helpdesk_nginx
    ports:
      - '8089:80'
    volumes:
      - .:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - phpfpm
    restart: always
    networks:
      - helpdesk_net

  db:
    image: mysql:8.0
    container_name: helpdesk_db
    ports:
      - '3308:3306'
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hesk_db
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    restart: always
    networks:
      - helpdesk_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: helpdesk_phpmyadmin
    ports:
      - '8081:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    restart: always
    networks:
      - helpdesk_net

networks:
  helpdesk_net:
    driver: bridge

volumes:
  db_data:
